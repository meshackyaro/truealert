[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
# Electroneum Smart Chain supports opcodes up to London (no PUSH0 / Shanghai,
# no TLOAD / MCOPY / Cancun). "paris" produces bytecode it can execute.
evm_version = "paris"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[rpc_endpoints]
electroneum_testnet = "https://rpc.ankr.com/electroneum_testnet"
electroneum = "https://rpc.electroneum.com"

[fmt]
line_length = 100
